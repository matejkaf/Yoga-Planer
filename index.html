<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yoga">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#5a4a9a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Yoga-Ablauf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: the pictogram tile takes everything the screen can spare and is the only control (tap left = back, tap middle/right = next, double tap = start/pause). Below it one slim strip with name, next exercise and countdown. The sequence list is a drawer that is closed by default. */
:root {
  --bg: #eceef3;
  --surface: #fbfbfd;
  --surface2: #e2e5ee;
  --fg: #1c2032;
  --muted: #5d6480;
  --line: #cfd3e0;
  --accent: #5a4a9a;
  --accent-fg: #ffffff;
  --warn: #b4570c;
  --ok: #2f7d5b;
  --tile: #fafaf6;
  --tile-ink: #6b6f80;
  --scrim: rgba(18, 20, 32, 0.55);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Helvetica Neue", sans-serif;
  --font-body: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121420; --surface: #1b1e2e; --surface2: #262a3e; --fg: #ecedf6; --muted: #9aa1bf;
    --line: #2f3450; --accent: #b3a4ee; --accent-fg: #161230; --warn: #f0a35a; --ok: #6cc9a0;
    --tile: #fafaf6; --tile-ink: #6b6f80; --scrim: rgba(0, 0, 0, 0.65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121420; --surface: #1b1e2e; --surface2: #262a3e; --fg: #ecedf6; --muted: #9aa1bf;
  --line: #2f3450; --accent: #b3a4ee; --accent-fg: #161230; --warn: #f0a35a; --ok: #6cc9a0;
  --tile: #fafaf6; --tile-ink: #6b6f80; --scrim: rgba(0, 0, 0, 0.65);
  color-scheme: dark;
}
html, body { height: 100%; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 17px; line-height: 1.35;
  padding-inline: 12px; padding-block: 8px;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
*, *::before, *::after { box-sizing: border-box; }
button, input, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, label:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; max-width: 1600px; margin-inline: auto; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; letter-spacing: -0.01em; margin-right: auto; }
.clock { display: flex; flex-wrap: wrap; gap: 2px 16px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.9rem; }
.clock b { font-family: var(--font-mono); font-weight: 500; color: var(--fg); }
.ghost { background: none; border: 1px solid var(--line); border-radius: 10px; padding: 6px 14px; min-height: 44px; cursor: pointer; }
.total-bar { flex-basis: 100%; height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.total-bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.3s linear; }
.total-bar.over > i { background: var(--warn); }
.example-tag { display: inline-block; font-family: var(--font-body); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; background: var(--surface2); color: var(--muted); border-radius: 6px; padding: 2px 8px; margin-left: 8px; vertical-align: middle; }

/* play view */
.play { display: grid; grid-template-rows: minmax(0, 1fr); min-height: 0; }
.stagebox { position: relative; background: var(--tile); border-radius: 18px; overflow: hidden; min-height: 0; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; border: 1px solid var(--line); }
.tilebody { position: absolute; inset: 0; display: grid; gap: 8px 18px; padding: 14px 14px 22px; text-align: left; color: #1c2032;
  grid-template-columns: minmax(0, 1fr) clamp(230px, 31%, 420px); grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "head side" "pic side" "pic timer"; }
.tl-head { grid-area: head; min-width: 0; }
.tl-head .eyebrow, .tl-side .eyebrow { color: var(--tile-ink); }
.tl-head .name { color: #1c2032; font-size: clamp(2rem, 6.5vh, 3.6rem); line-height: 1.05; }
.tl-head .note { color: var(--tile-ink); font-size: clamp(1.05rem, 2.6vh, 1.4rem); }
.tl-pic { grid-area: pic; position: relative; min-height: 0; min-width: 0; display: flex; align-items: center; justify-content: center; text-align: center; }
.tl-pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center; display: block; pointer-events: none; }
.tl-side { grid-area: side; min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
.nxb { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tl-side .thumb { width: 100%; height: clamp(120px, 26vh, 300px); border: 1px solid #e6e6df; }
.namerow { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
.namerow .name { min-width: 0; }
.namerow .count { font-family: var(--font-mono); font-size: clamp(0.9rem, 2.2vh, 1.2rem); color: var(--tile-ink); white-space: nowrap; }
.nmrow { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; min-width: 0; }
.nmrow .nm { min-width: 0; }
.nmrow .dur { white-space: nowrap; }
.tl-side .nxb.small { width: 60%; align-self: flex-end; text-align: left; }
.tl-side .nxb.small .thumb { height: clamp(70px, 14vh, 150px); }
.tl-side .nxb.small .nm { font-size: clamp(1.15rem, 2.7vh, 1.6rem); }
.tl-side .nxb.small .dur { font-size: 0.95rem; }
.tl-side .nm { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.5rem, 4vh, 2.3rem); line-height: 1.1; overflow-wrap: anywhere; color: #1c2032; }
.tl-side .dur { font-family: var(--font-mono); font-size: 1.1rem; color: var(--tile-ink); }
.tl-timer { grid-area: timer; text-align: right; align-self: end; min-width: 0; }
.tl-timer .digits { font-size: clamp(2.6rem, 9vh, 5rem); color: #1c2032; }
.tl-timer .digits.idle { color: var(--tile-ink); }
.tl-timer .digits.over { color: #b4570c; }
.tl-timer .sub { color: var(--tile-ink); }
@media (max-width: 760px), (orientation: portrait) {
  .tilebody { grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "head head" "pic pic" "side timer"; }
  .tl-side { flex-direction: row; flex-wrap: wrap; align-items: flex-start; gap: 6px 20px; }
  .nxb { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 2px 10px; }
  .nxb .eyebrow { flex-basis: 100%; }
  .tl-side .thumb { width: 96px; height: 96px; }
  .tl-side .nxb.small { width: auto; }
  .tl-side .nxb.small .thumb { width: 64px; height: 64px; }
}
.tilebody .bigname { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.6rem, 13vh, 8rem); line-height: 1.02; letter-spacing: -0.02em; color: #1c2032; text-wrap: balance; overflow-wrap: anywhere; }
.tilebody .bignote { display: block; margin-top: 12px; font-family: var(--font-body); font-weight: 400; font-size: clamp(1.1rem, 3vh, 1.8rem); letter-spacing: 0; color: var(--tile-ink); }
.chev { position: absolute; top: 50%; transform: translateY(-50%); font-size: 3rem; line-height: 1; color: var(--tile-ink); opacity: 0.28; pointer-events: none; font-family: var(--font-display); }
.chev.l { left: 10px; } .chev.r { display: none; }
.chip { position: absolute; bottom: 22px; left: 16px; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; font-family: var(--font-mono); font-size: 0.9rem; pointer-events: none; }
.chip.warn { color: var(--warn); }
.flash { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: var(--scrim); color: #fff; font-size: 3.4rem; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; font-family: var(--font-display); }
.flash.on { animation: flash 0.65s ease-out forwards; }
@keyframes flash { 0% { opacity: 0.95; transform: scale(0.85); } 100% { opacity: 0; transform: scale(1.15); } }

.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: #e2e5ee; overflow: hidden; pointer-events: none; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.25s linear; }
.bar.over > i { background: var(--warn); }

.strip { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) auto; align-items: center; gap: 6px 20px; }
@media (max-width: 760px) { .strip { grid-template-columns: minmax(0, 1fr) auto; } .strip .nx { grid-column: 1 / -1; grid-row: 2; } }
.eyebrow { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 600; }
.name { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.3rem, 3.4vh, 2rem); line-height: 1.1; letter-spacing: -0.01em; margin: 0; overflow-wrap: anywhere; }
.note { margin: 2px 0 0; color: var(--muted); font-size: 1rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cur-info, .nx { min-width: 0; }
.nx { display: flex; align-items: center; gap: 10px; }
.nx .txt { min-width: 0; }
.nx .nm { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; overflow-wrap: anywhere; }
.nx .dur { font-family: var(--font-mono); color: var(--muted); font-size: 0.85rem; }
.thumb { position: relative; background: var(--tile); border-radius: 8px; overflow: hidden; }
.thumb img { position: absolute; inset: 3px; width: calc(100% - 6px); height: calc(100% - 6px); object-fit: contain; object-position: center; display: block; }
.nx .thumb { width: 52px; height: 52px; flex: none; }
.timer { text-align: right; }
.digits { font-family: var(--font-mono); font-weight: 500; font-size: clamp(2.4rem, 8vh, 4.4rem); line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.digits.over { color: var(--warn); }
.digits.idle { color: var(--muted); }
.sub { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }

/* drawer with the sequence list */
.drawer-wrap { position: fixed; inset: 0; z-index: 8; display: flex; justify-content: flex-end; background: var(--scrim); }
.drawer { width: min(380px, 92vw); height: 100%; background: var(--surface); padding: 8px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; min-height: 0; }
.list-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 8px; }
.mini { background: none; border: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 8px; min-height: 44px; }
#list { overflow-y: auto; min-height: 0; }
.grp { display: flex; justify-content: space-between; gap: 8px; padding: 12px 10px 2px; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; color: var(--muted); }
.item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: none; border-radius: 10px; padding: 4px 10px; min-height: 48px; cursor: pointer; }
.item .n { font-family: var(--font-mono); color: var(--muted); font-size: 0.85rem; width: 1.5rem; flex: none; }
.item .thumb { width: 40px; height: 40px; flex: none; }
.item .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.item .d { font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.item.done .t { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.item.done .d { color: var(--ok); }
.item.cur { background: var(--accent); color: var(--accent-fg); }
.item.cur .n, .item.cur .d { color: var(--accent-fg); opacity: 0.85; }

/* buttons (editor, dialogs) */
.btn { min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-family: var(--font-body); font-weight: 600; font-size: 1.05rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding-inline: 18px; touch-action: manipulation; }
.btn.go { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.small { min-height: 48px; border-radius: 12px; font-size: 1rem; padding-inline: 16px; }

/* editor */
.editor { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.ed-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.ed-head h2 { font-family: var(--font-display); margin: 0 auto 0 0; font-size: 1.4rem; }
.status { color: var(--muted); font-size: 0.95rem; }
.ed-body { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding-bottom: 12px; }
.blk { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.blk-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.blk-head .title { flex: 1 1 220px; min-width: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; }
.field { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-height: 48px; min-width: 0; width: 100%; }
.sum { font-family: var(--font-mono); color: var(--muted); font-size: 0.9rem; }
.srow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.srow .pic { width: 64px; height: 64px; flex: none; border: 1px dashed var(--line); background: var(--tile); border-radius: 10px; cursor: pointer; padding: 3px; display: flex; align-items: center; justify-content: center; color: var(--tile-ink); font-size: 0.8rem; position: relative; overflow: hidden; }
.srow .pic img { position: absolute; inset: 3px; width: calc(100% - 6px); height: calc(100% - 6px); object-fit: contain; }
.srow .nm { flex: 2 1 200px; }
.srow .mn { flex: 0 0 84px; width: 84px; text-align: center; font-family: var(--font-mono); }
.srow .nt { flex: 3 1 240px; }
.sq { width: 44px; height: 44px; flex: none; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 1.05rem; line-height: 1; }
.sq[disabled] { opacity: 0.35; cursor: default; }
.sq.del { color: var(--warn); }
.addrow { display: flex; flex-wrap: wrap; gap: 8px; }

/* image chooser */
.overlay { position: fixed; inset: 0; background: var(--scrim); z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px; }
.panel { background: var(--surface); border-radius: 18px; padding: 16px; width: min(960px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 12px; }
.panel h3 { font-family: var(--font-display); margin: 0 auto 0 0; font-size: 1.3rem; }
.panel .bar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.grid { overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; min-height: 0; }
.cell { position: relative; background: var(--surface2); border-radius: 12px; border: 2px solid transparent; padding: 6px; display: flex; flex-direction: column; gap: 4px; align-items: stretch; cursor: pointer; text-align: center; }
.cell.sel { border-color: var(--accent); }
.cell .thumb { height: 96px; }
.cell span { font-size: 0.85rem; overflow-wrap: anywhere; }
.cell .x { position: absolute; top: 4px; right: 4px; min-width: 40px; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--warn); font-weight: 600; cursor: pointer; padding: 0 8px; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; font-size: 0; }
.hint { color: var(--muted); margin: 0; }

.lrow { display: flex; gap: 8px; align-items: center; }
.lrow .item { flex: 1; min-width: 0; }
.lmin { font-family: var(--font-mono); font-size: 0.85rem; opacity: 0.7; margin-left: auto; white-space: nowrap; }
.ed-head .field.lname { flex: 1 1 160px; min-width: 120px; max-width: 360px; }
@media (prefers-reduced-motion: reduce) { .bar > i, .total-bar > i { transition: none; } .flash.on { animation-duration: 0.01s; } }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div class="brand">Yoga-Ablauf <span class="example-tag" id="example-tag" hidden>Beispiel</span></div>
    <div class="clock" id="clock"></div>
    <button class="ghost" id="lesson-btn" type="button">Stunden</button>
    <button class="ghost" id="list-btn" type="button">Ablauf</button>
    <button class="ghost" id="edit-btn" type="button">Bearbeiten</button>
    <button class="ghost" id="fs-btn" type="button" hidden>Vollbild</button>
    <div class="total-bar" id="total-bar"><i></i></div>
  </header>

  <section class="play" id="play">
    <div class="stagebox" id="stagebox" role="button" tabindex="0" aria-label="Übung. Doppelt tippen: Start oder Pause. Links tippen: zurück. Sonst tippen: nächste Übung.">
      <div class="tilebody" id="tilebody"></div>
      <span class="chev l" aria-hidden="true">‹</span><span class="chev r" aria-hidden="true">›</span>
      <span class="chip" id="chip"></span>
      <div class="flash" id="flash" aria-hidden="true"></div>
      <div class="bar" id="bar"><i></i></div>
    </div>
  </section>

  <section class="editor" id="editor" hidden>
    <div class="ed-head">
      <h2>Stunde</h2>
      <input class="field lname" id="lesson-name" type="text" placeholder="Name der Stunde" autocomplete="off" spellcheck="false">
      <span class="status" id="ed-status"></span>
      <button class="btn small" id="images-btn" type="button">Bilder verwalten</button>
      <button class="btn small" id="cancel-plan" type="button">Abbrechen</button>
      <button class="btn small go" id="save-plan" type="button">Speichern</button>
    </div>
    <div class="ed-body" id="ed-body"></div>
  </section>
</div>

<div class="drawer-wrap" id="drawer" hidden>
  <aside class="drawer" role="dialog" aria-label="Ablauf">
    <div class="list-head">
      <span class="eyebrow">Ablauf</span>
      <span>
        <button class="mini" id="reset-btn" type="button">Zurücksetzen</button>
        <button class="mini" id="drawer-close" type="button">Schließen</button>
      </span>
    </div>
    <div id="list"></div>
  </aside>
</div>

<div class="drawer-wrap" id="lessons-wrap" hidden>
  <aside class="drawer" role="dialog" aria-label="Stunden">
    <div class="list-head">
      <span class="eyebrow">Stunden</span>
      <span>
        <button class="mini" id="lesson-new" type="button">Neue Stunde</button>
        <button class="mini" id="lesson-dup" type="button">Duplizieren</button>
        <button class="mini" id="lessons-close" type="button">Schließen</button>
      </span>
    </div>
    <p class="hint" id="lesson-status"></p>
    <div id="lesson-list"></div>
  </aside>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="ov-title">
    <div class="bar-row">
      <h3 id="ov-title">Bild wählen</h3>
      <label class="btn small filebtn" id="upload-label">Bild hinzufügen<input id="file-input" type="file" accept="image/*" multiple></label>
      <button class="btn small" id="no-image" type="button">Kein Bild</button>
      <button class="btn small go" id="ov-close" type="button">Schließen</button>
    </div>
    <p class="hint" id="ov-status"></p>
    <div class="grid" id="ov-grid"></div>
  </div>
</div>

<script>

    var ctx = c.getContext("2d"); var alpha = /png|webp|gif/.test(file.type);
    if (!alpha) { ctx.fillStyle = "#fafaf6"; ctx.fillRect(0, 0, c.width, c.height); }
    ctx.drawImage(im, 0, 0, c.width, c.height);
    var type = alpha ? "image/png" : "image/jpeg";
    var blob = await new Promise(function (res) { c.toBlob(res, type, 0.88); });
    if (!blob) throw new Error("encode");
    return { blob: blob, type: type };
  }
  var UPLOAD_MSG = { too_large: "Datei zu groß.", unsupported_type: "Dateityp wird nicht unterstützt.", quota_or_state: "Speicherplatz voll.", rate_limited: "Zu viele Uploads auf einmal. Kurz warten.", not_granted: "Hochladen ist hier nicht erlaubt." };
  $("file-input").addEventListener("change", async function (ev) {
    var files = Array.prototype.slice.call(ev.target.files || []); ev.target.value = "";
    if (!files.length || !assetsApi) return;
    var ok = 0, fail = "";
    for (var i = 0; i < files.length; i++) {
      $("ov-status").textContent = "Lade hoch " + (i + 1) + " von " + files.length + " …";
      try {
        var p = await prepareImage(files[i]);
        var res = await assetsApi.upload(p.blob, { type: p.type });
        lib.push({ id: res.id, name: files[i].name.replace(/\.[^.]+$/, "").slice(0, 60) || "Bild" });
        await saveLib(); ok++;
        if (chooser.mode === "pick" && chooser.step && files.length === 1) { setStepImage(chooser.step, lib[lib.length - 1]); closeChooser(); $("ov-status").textContent = ""; return; }
        renderChooser();
      } catch (e) { fail = UPLOAD_MSG[e && e.code] || "Bild konnte nicht verarbeitet werden."; }
    }
    $("ov-status").textContent = (ok ? ok + " Bild(er) hinzugefügt. " : "") + fail;
    renderChooser();
  });

  /* ---------- keyboard ---------- */
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") { closeDrawer(); closeLessons(); return; }
    if (editing || !$("overlay").hidden || !$("drawer").hidden || !$("lessons-wrap").hidden) return;
    var t = ev.target && ev.target.tagName; if (t === "INPUT" || t === "TEXTAREA") return;
    if (ev.key === "ArrowRight") next();
    else if (ev.key === "ArrowLeft") prev();
    else if (ev.key === " ") { ev.preventDefault(); toggle(); }
  });

  /* ---------- start ---------- */
  var initial = [], cachedL = lsGet(LS_LESSONS), cachedP = lsGet(LS_PLAN);
  if (cachedL) { try { initial = normalizeLessons(JSON.parse(cachedL)); } catch (e) {} }
  if (!initial.length && cachedP) { try { var cb = normalize(JSON.parse(cachedP)); if (cb.length) initial = [{ id: "l1", name: "Stunde 1", blocks: cb }]; } catch (e) {} }
  if (initial.length) applyLessons(initial); else { restoreRun(); renderAll(); renderLessonUi(); }

  (async function connect() {
    if (!window.claude || !window.claude.use) return;
    var db = null;
    try { db = await window.claude.use("db"); } catch (e) {}
    try { assetsApi = await window.claude.use("assets"); } catch (e) {}
    if (!db) return;
    planDoc = db.doc("yoga/plan"); lessonsDoc = db.doc("yoga/lessons"); libDoc = db.doc("yoga/lib");
    if (editing) $("images-btn").hidden = !(assetsApi && libDoc);
    libDoc.onSnapshot(function (snap) {
      var d = snap.exists ? snap.data() : null;
      lib = d && Array.isArray(d.images) ? d.images.filter(function (x) { return x && ID_RE.test(String(x.id)); }).map(function (x) { return { id: String(x.id), name: String(x.name || "Bild") }; }) : [];
      if (!$("overlay").hidden) renderChooser();
    }, function () {});

    /* one-time migration of the former single plan (yoga/plan) into the lessons list */
    var lessonsMissing = false, planSeen = false, planBlocks = [], migrated = false;
    function tryMigrate() {
      if (!lessonsMissing || !planSeen || migrated) return;
      migrated = true;
      var bl = planBlocks.length ? planBlocks : (isExample ? [] : blocks);
      if (!bl.length) return;
      var nl = [{ id: "l1", name: "Stunde 1", blocks: bl }];
      persist(nl).then(function () { if (editing) pendingLessons = nl; else applyLessons(nl); }).catch(function () {});
    }
    planDoc.onSnapshot(function (snap) {
      planSeen = true;
      planBlocks = snap.exists ? normalize(snap.data() && snap.data().blocks ? clone(snap.data().blocks) : []) : [];
      tryMigrate();
    }, function () { planSeen = true; tryMigrate(); });
    lessonsDoc.onSnapshot(function (snap) {
      if (!snap.exists) { lessonsMissing = true; tryMigrate(); return; }
      var d = snap.data(), nl = normalizeLessons(d && d.lessons ? clone(d.lessons) : []);
      if (!nl.length) return;
      lessonsMissing = false;
      lsSet(LS_LESSONS, JSON.stringify(nl));
      if (editing) { pendingLessons = nl; return; }
      applyLessons(nl);
    }, function () {});
  })();
})();
</script>
